# Auto-generated by Firebase CLI, updated for React 19
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        env:
          VITE_WHATSAPP_NUMBER: ${{ secrets.VITE_WHATSAPP_NUMBER }}
          VITE_PHONE_DISPLAY: ${{ secrets.VITE_PHONE_DISPLAY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}
          VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID }}
          WHATSAPP_PROVIDER: ${{ secrets.WHATSAPP_PROVIDER }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
        run: npm run build

      # ── Functions: create .env from GitHub Secrets ──────────────────────────
      - name: Create functions .env
        run: |
          echo "SITE_CLEAN_WEBHOOK=${{ secrets.SITE_CLEAN_WEBHOOK }}" >> functions/.env
          echo "WASTE_SAND_WEBHOOK=${{ secrets.WASTE_SAND_WEBHOOK }}" >> functions/.env
          echo "DEBRIS_SAND_WEBHOOK=${{ secrets.DEBRIS_SAND_WEBHOOK }}" >> functions/.env
          echo "ORDERS_WEBHOOK=${{ secrets.ORDERS_WEBHOOK }}" >> functions/.env
          echo "WHATSAPP_ACCESS_TOKEN=${{ secrets.WHATSAPP_ACCESS_TOKEN }}" >> functions/.env
          echo "WHATSAPP_PHONE_NUMBER_ID=${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}" >> functions/.env
          echo "WHATSAPP_PROVIDER=${{ secrets.WHATSAPP_PROVIDER }}" >> functions/.env
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> functions/.env
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> functions/.env
          echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> functions/.env
          echo "SES_FROM_EMAIL=${{ secrets.SES_FROM_EMAIL }}" >> functions/.env
          echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}" >> functions/.env
          echo "GOOGLE_BUSINESS_ACCOUNT_ID=${{ secrets.GOOGLE_BUSINESS_ACCOUNT_ID }}" >> functions/.env
          echo "GOOGLE_BUSINESS_LOCATION_ID=${{ secrets.GOOGLE_BUSINESS_LOCATION_ID }}" >> functions/.env
          echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}" >> functions/.env
          echo "GOOGLE_BUSINESS_ACCOUNT_ID=${{ secrets.GOOGLE_BUSINESS_ACCOUNT_ID }}" >> functions/.env
          echo "GOOGLE_BUSINESS_LOCATION_ID=${{ secrets.GOOGLE_BUSINESS_LOCATION_ID }}" >> functions/.env

      # ── Functions: install & deploy ─────────────────────────────────────────
      - name: Install functions dependencies
        run: cd functions && npm install --legacy-peer-deps

      - name: Deploy Firebase Functions
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_VIKRAM_PRODUCTS }}' > /tmp/sa.json
          npx firebase-tools deploy --only functions --project vikram-products
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json

      # ── Hosting deploy ───────────────────────────────────────────────────────
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VIKRAM_PRODUCTS }}
          channelId: live
          projectId: vikram-products
